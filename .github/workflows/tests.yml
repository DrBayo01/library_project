name: Tests

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env
        run: |
          cp .env.example .env

      - name: Start containers
        run: docker compose up -d --build

      - name: Run tests
        run: docker compose exec -T backend pytest

      - name: Shutdown
        if: always()
        run: docker compose down -v